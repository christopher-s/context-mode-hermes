[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-mode-hermes"
version = "1.0.0"
description = "Context Mode plugin for Hermes Agent — context window protection via sandboxed execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Chris Staley", email = "chris@spacedinosaurs.com" },
]
keywords = ["context-mode", "hermes", "hermes-agent", "llm", "context-window", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.entry-points."hermes_agent.plugins"]
context-mode = "context_mode_hermes:register"

[tool.setuptools.packages.find]
include = ["context_mode_hermes*"]
